name: Static export
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: rail-software-website-static
          path: dist/
          if-no-files-found: error
